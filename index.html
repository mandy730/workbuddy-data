<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#e6a9d8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Mandy工作台" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<title>Mandy的工作台 · 综合管理工作台</title>
<style>
/* ===== Mandy的工作台 · 浅粉紫主题 ===== */
:root{
  --pink-50:#fef8fc; --pink-100:#fdeef6; --pink-200:#f9dcf0; --pink-300:#f1c4e6;
  --pink-400:#e6a9d8; --pink-500:#d68fc6; --pink-600:#c272b1; --pink-700:#a85a98;
  --violet-100:#f5effe; --violet-200:#ece0fd; --violet-300:#d8c2fb;
  --violet-400:#bf9ef3; --violet-500:#a87ef0; --violet-600:#8e63dd;
  --mint:#7fd8c4; --lemon:#ffd166; --coral:#ff8b7b; --sky:#7cc4f8;
  --ink:#574463; --ink-2:#7a6588; --muted:#ab9cb8; --line:#f1e6f1;
  --card:#ffffff; --radius:20px; --radius-sm:14px;
  --shadow:0 8px 24px rgba(190,120,170,.10), 0 2px 6px rgba(143,90,238,.05);
  --shadow-lg:0 16px 40px rgba(190,120,170,.14);
  --grad:linear-gradient(135deg,#ffc6e4 0%,#d9c2ff 100%);
  --grad-soft:linear-gradient(135deg,#fdeef7 0%,#f3ecff 100%);
  --safe-b:env(safe-area-inset-bottom,0px);
  --sidebar-w:230px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
  color:var(--ink); background:linear-gradient(180deg,#fefafd 0%,#fbf6ff 45%,#f6f1ff 100%);
  min-height:100vh; font-size:15px; line-height:1.6; overflow-x:hidden;
}
.bg-deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5}
.b1{width:340px;height:340px;background:#ffd6ec;top:-90px;left:-70px}
.b2{width:300px;height:300px;background:#e4d2ff;top:30%;right:-100px}
.b3{width:280px;height:280px;background:#ffe9cf;bottom:-80px;left:20%}

/* ---- 应用外壳 ---- */
.app-shell{display:flex;min-height:100vh}
.app-main{flex:1;margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1}

/* ---- 左侧边栏 ---- */
.sidebar{
  width:var(--sidebar-w);position:fixed;left:0;top:0;bottom:0;z-index:60;
  background:linear-gradient(180deg,#ffd4ec 0%,#f4bcdf 55%,#dcbff6 100%);
  color:#fff;display:flex;flex-direction:column;padding:22px 12px 14px;
  box-shadow:4px 0 24px rgba(190,120,170,.18);
}
.sidebar-brand{text-align:center;margin-bottom:26px;padding:0 4px}
.sidebar-brand .bow{font-size:34px;line-height:1;filter:drop-shadow(0 2px 4px rgba(180,50,110,.25))}
.sidebar-brand h2{margin:10px 0 0;font-size:16px;font-weight:800;letter-spacing:.5px}
.sidebar-brand p{margin:3px 0 0;font-size:11px;opacity:.92;font-weight:500}
.sidebar-nav{flex:1;display:flex;flex-direction:column;gap:7px;overflow-y:auto;scrollbar-width:thin}
.sidebar-nav::-webkit-scrollbar{width:4px}
.sidebar-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:4px}
.sidebar-item{
  display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:16px;
  color:#fff;background:transparent;border:none;font-size:14px;font-weight:700;
  cursor:pointer;transition:.18s;text-align:left;width:100%;font-family:inherit;
  position:relative;
}
.sidebar-item:hover{background:rgba(255,255,255,.18)}
.sidebar-item.on{background:#fff;color:var(--pink-600);box-shadow:0 4px 14px rgba(180,50,110,.22)}
.sidebar-item .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:rgba(255,255,255,.22);flex:none;transition:.18s}
.sidebar-item.on .ic{background:var(--grad);color:#fff;box-shadow:0 4px 10px rgba(247,107,176,.35)}
.sidebar-item .txt{flex:1;min-width:0}
.sidebar-item .cnt{margin-left:auto;background:rgba(255,255,255,.28);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;font-weight:800;flex:none}
.sidebar-item.on .cnt{background:var(--pink-100);color:var(--pink-600)}
.sidebar-footer{font-size:11px;text-align:center;opacity:.85;padding-top:10px;line-height:1.5}
.sidebar-backdrop{position:fixed;inset:0;z-index:55;background:rgba(75,53,87,.35);opacity:0;pointer-events:none;transition:.25s}

/* ---- 顶栏 ---- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);box-shadow:0 4px 18px rgba(224,77,151,.06)}
.topbar-inner{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{width:40px;height:40px;border-radius:14px;background:var(--grad);display:grid;place-items:center;font-size:20px;box-shadow:0 6px 14px rgba(247,107,176,.35);flex:none}
.brand-text{min-width:0}
.brand-text h1{margin:0;font-size:17px;font-weight:800;letter-spacing:.3px;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.brand-text p{margin:0;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-actions{display:flex;gap:8px;flex:none}
.icon-btn{width:38px;height:38px;border-radius:13px;border:1px solid var(--pink-200);background:#fff;color:var(--pink-600);
  font-size:18px;cursor:pointer;display:grid;place-items:center;transition:.18s;font-weight:700}
.icon-btn:hover{background:var(--pink-100);transform:translateY(-1px)}
.btn-ghost{height:38px;border-radius:13px;border:1px solid var(--pink-200);background:#fff;color:var(--pink-600);
  font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:0 14px;transition:.18s;white-space:nowrap}
.btn-ghost:hover{background:var(--pink-100);transform:translateY(-1px)}
.menu-btn{display:none}

/* 旧 tabs 保留，仅作兼容/隐藏，实际由 sidebar 替代 */
.tabs{display:none}

/* ---- 布局 ---- */
.view{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:16px 16px 40px;width:100%}
.footer{position:relative;z-index:1;text-align:center;color:var(--muted);font-size:12px;padding:0 16px calc(24px + var(--safe-b))}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);position:relative}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h3{margin:0;font-size:15px;font-weight:800;display:flex;align-items:center;gap:7px}
.card-h .sub{font-size:11px;color:var(--muted);font-weight:500}
.section-title{margin:22px 0 12px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.section-title small{font-size:11px;color:var(--muted);font-weight:500}

/* ---- 安安日程时间线 ---- */
.sched{display:flex;flex-direction:column;padding:4px 2px}
.sched-i{display:grid;grid-template-columns:66px 14px 1fr 26px;align-items:center;gap:10px;padding:11px 4px;cursor:pointer;transition:background .15s}
.sched-i:hover{background:var(--pink-50)}
.sched-i+.sched-i{border-top:1px dashed var(--line)}
.sched-t{font-size:11.5px;font-weight:800;color:var(--pink-600);text-align:center;background:var(--pink-50);border-radius:10px;padding:5px 3px;line-height:1.15;white-space:nowrap}
.sched-line{width:2px;height:100%;min-height:34px;background:linear-gradient(var(--pink-200),var(--violet-200));border-radius:2px;justify-self:center}
.sched-body{display:flex;flex-direction:column;gap:3px;min-width:0}
.sched-body b{font-size:13.5px;color:var(--ink);font-weight:600;line-height:1.3}
.sched-sub{font-size:11px;color:var(--muted)}
.sched-ck{font-size:16px;text-align:center;line-height:1}
.sched-i.done .sched-body b{text-decoration:line-through;color:var(--muted)}
.sched-i.done .sched-t{opacity:.55}
.sched-i.done .sched-line{opacity:.4}

/* ---- Hero / 欢迎区 ---- */
.hero{background:var(--grad);border-radius:24px;padding:20px;color:#fff;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.16);right:-60px;top:-70px}
.hero::before{content:"";position:absolute;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12);right:60px;bottom:-70px}
.hero h2{margin:0 0 4px;font-size:20px;font-weight:800}
.hero p{margin:0;opacity:.92;font-size:12.5px}
.hero-row{display:flex;align-items:center;justify-content:space-between;gap:16px;position:relative;z-index:1;flex-wrap:wrap}
.ring{width:82px;height:82px;flex:none;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{font-size:19px;font-weight:800;line-height:1}
.ring i{font-size:10px;font-style:normal;opacity:.9;display:block;text-align:center}
.hero-stats{display:flex;gap:8px;margin-top:14px;position:relative;z-index:1;flex-wrap:wrap}
.hstat{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.32);border-radius:14px;padding:8px 12px;min-width:88px}
.hstat b{display:block;font-size:18px;font-weight:800;line-height:1.2}
.hstat span{font-size:11px;opacity:.92}

.hero-date{font-size:13px;opacity:.95;margin-bottom:4px;font-weight:600}
.hero-clock{font-size:42px;font-weight:800;line-height:1.1;letter-spacing:.5px;margin-bottom:14px;font-variant-numeric:tabular-nums}
.welcome-card{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.32);border-radius:18px;padding:14px 16px;margin-top:14px;position:relative;z-index:1}
.welcome-card b{font-size:13px;display:block;margin-bottom:5px}
.welcome-card p{margin:0;font-size:12.5px;line-height:1.7;opacity:.95}

/* ---- 分类汇总卡 ---- */
.kind-card{border-radius:var(--radius);padding:14px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}
.kind-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.kind-ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:19px;flex:none}
.kind-head b{font-size:14px;display:block}
.kind-head span{font-size:11px;color:var(--muted)}
.kind-num{margin-left:auto;font-size:26px;font-weight:800;line-height:1}
.kind-num small{font-size:11px;font-weight:600;color:var(--muted);display:block;text-align:right}

/* ---- 任务项 ---- */
.task{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:var(--radius-sm);border:1px solid var(--line);
  background:#fffdfe;margin-bottom:8px;transition:.16s}
.task:hover{border-color:var(--pink-200);background:var(--pink-50)}
.task.done{opacity:.5}
.task.done .t-title{text-decoration:line-through}
.chk{width:22px;height:22px;border-radius:8px;border:2px solid var(--pink-300);background:#fff;flex:none;cursor:pointer;
  display:grid;place-items:center;color:#fff;font-size:13px;transition:.16s;margin-top:1px}
.chk:hover{border-color:var(--pink-500);transform:scale(1.06)}
.chk.on{background:var(--grad);border-color:transparent}
.t-body{flex:1;min-width:0}
.t-title{font-size:14px;font-weight:600;word-break:break-word}
.t-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;align-items:center}
.pill{font-size:10.5px;padding:2px 8px;border-radius:999px;font-weight:700;white-space:nowrap}
.p-high{background:#ffe3e3;color:#d63d3d}
.p-mid{background:#fff3d6;color:#c98a06}
.p-low{background:#e4f7f1;color:#2a9c81}
.p-rep{background:var(--violet-100);color:var(--violet-600)}
.p-tag{background:var(--pink-100);color:var(--pink-600)}
.p-date{background:#eef4ff;color:#4a72c4}
.p-warn{background:#ffe8d6;color:#d1741f}
.p-sub{background:#f1ecf7;color:var(--ink-2)}
.t-note{font-size:11.5px;color:var(--muted);margin-top:4px;white-space:pre-wrap}
.t-act{display:flex;gap:4px;flex:none}
.mini{width:26px;height:26px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12px;
  display:grid;place-items:center;color:var(--muted);transition:.16s}
.mini:hover{color:var(--pink-600);border-color:var(--pink-300);background:var(--pink-50)}

/* ---- 按钮 ---- */
.btn{border:none;border-radius:12px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:.18s;
  font-family:inherit;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn-p{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(247,107,176,.32)}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(247,107,176,.4)}
.btn-g{background:#fff;color:var(--ink-2);border:1px solid var(--pink-200)}
.btn-g:hover{background:var(--pink-50);color:var(--pink-600)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:10px}
.btn-block{width:100%}
.add-line{border:1.5px dashed var(--pink-300);background:var(--pink-50);color:var(--pink-600);border-radius:var(--radius-sm);
  padding:9px;width:100%;font-size:12.5px;font-weight:700;cursor:pointer;transition:.18s;font-family:inherit}
.add-line:hover{background:var(--pink-100)}

/* ---- 打卡网格 ---- */
.ck-wrap{overflow-x:auto;scrollbar-width:thin}
.ck-table{width:100%;border-collapse:separate;border-spacing:0 6px;min-width:430px}
.ck-table th{font-size:11px;color:var(--muted);font-weight:700;padding:0 2px 4px;text-align:center}
.ck-table th:first-child{text-align:left;padding-left:8px}
.ck-name{font-size:13px;font-weight:700;padding:8px;background:var(--pink-50);border-radius:12px 0 0 12px;white-space:nowrap}
.ck-name small{display:block;font-size:10px;color:var(--muted);font-weight:500}
.ck-cell{background:var(--pink-50);text-align:center;padding:5px 2px;width:38px}
.ck-cell:last-child{border-radius:0 12px 12px 0}
.dot{width:26px;height:26px;border-radius:9px;border:2px solid var(--pink-200);background:#fff;cursor:pointer;
  display:grid;place-items:center;font-size:12px;color:transparent;transition:.16s;margin:0 auto}
.dot:hover{border-color:var(--pink-400);transform:scale(1.08)}
.dot.on{background:var(--grad);border-color:transparent;color:#fff}
.dot.today{box-shadow:0 0 0 2px var(--violet-300)}
.ck-goal{font-size:11px;font-weight:700;color:var(--pink-600);white-space:nowrap;padding-right:8px}
.week-nav{display:flex;align-items:center;gap:8px}
.week-nav b{font-size:12.5px;color:var(--ink-2)}

/* ---- 事件 / 倒计时 ---- */
.ev{display:flex;gap:12px;align-items:center;padding:11px;border-radius:var(--radius-sm);border:1px solid var(--line);margin-bottom:8px;background:#fffdfe}
.ev-d{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--grad-soft);color:var(--pink-600);text-align:center}
.ev-d b{font-size:17px;font-weight:800;line-height:1}
.ev-d span{font-size:9.5px;color:var(--muted)}
.ev-b{flex:1;min-width:0}
.ev-b b{font-size:13.5px;display:block}
.ev-cd{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;background:#ffe3ef;color:var(--pink-600);white-space:nowrap;flex:none}
.ev-cd.soon{background:#ffe0d6;color:#e2593a}

/* ---- 看板 ---- */
.kb{display:grid;gap:10px;grid-template-columns:repeat(5,minmax(150px,1fr));overflow-x:auto;padding-bottom:6px}
@media(max-width:900px){.kb{grid-template-columns:repeat(5,190px)}}
.kb-col{background:var(--grad-soft);border-radius:var(--radius-sm);padding:10px;min-height:90px}
.kb-col h4{margin:0 0 8px;font-size:12px;font-weight:800;display:flex;justify-content:space-between;color:var(--ink-2)}
.kb-card{background:#fff;border-radius:12px;padding:9px;margin-bottom:7px;box-shadow:0 2px 8px rgba(224,77,151,.08);cursor:pointer;transition:.16s}
.kb-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kb-card b{font-size:12.5px;display:block;line-height:1.4}
.kb-card .t-meta{margin-top:5px}

/* ---- 表格 ---- */
.tbl-wrap{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
table.data th{background:var(--pink-50);color:var(--ink-2);font-size:11px;font-weight:700;padding:9px 10px;text-align:left;white-space:nowrap}
table.data th:first-child{border-radius:10px 0 0 10px}
table.data th:last-child{border-radius:0 10px 10px 0}
table.data td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data tr:last-child td{border-bottom:none}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.pos{color:#e0466f}
.neg{color:#2a9c81}

/* ---- 统计小块 ---- */
.stat{background:var(--grad-soft);border-radius:var(--radius-sm);padding:12px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:800;line-height:1.3}
.stat span{font-size:11px;color:var(--ink-2)}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:8px}
.bar-i{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.bar{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:var(--grad);transition:.4s;min-height:4px}
.bar-i span{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bar-i b{font-size:10.5px;font-weight:700;color:var(--pink-600)}

/* ---- 近1个月每日每笔 ---- */
.day-block{border-top:1px dashed var(--line);padding:10px 0}
.day-block:first-of-type{border-top:none;padding-top:2px}
.day-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.day-head b{font-size:13px;font-weight:800;color:var(--ink)}
.day-sum{font-size:11.5px;color:var(--muted)}
.day-sum .pos{font-style:normal;font-weight:700}
.day-sum .neg{font-style:normal;font-weight:700}
.day-items{display:flex;flex-direction:column;gap:6px;padding-left:2px}
.day-row{display:flex;align-items:center;gap:8px;font-size:12.5px}
.day-cat{font-weight:600;color:var(--ink-2)}
.day-amt{font-weight:800;font-variant-numeric:tabular-nums}
.day-note{color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-row .pill{flex:none}

/* ---- 进度条 ---- */
.pbar{height:8px;border-radius:999px;background:var(--pink-100);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--grad);border-radius:999px;transition:.5s}

/* ---- 表单 ---- */
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--pink-200);border-radius:12px;padding:10px 12px;
  font-size:13.5px;font-family:inherit;color:var(--ink);background:#fffdfe;outline:none;transition:.16s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pink-400);box-shadow:0 0 0 3px rgba(255,143,199,.16);background:#fff}
.field textarea{resize:vertical;min-height:66px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:520px){.row3{grid-template-columns:1fr 1fr}}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--pink-200);background:#fff;border-radius:10px;padding:7px 12px;font-size:12px;cursor:pointer;
  font-family:inherit;font-weight:600;color:var(--ink-2);transition:.16s}
.seg button.on{background:var(--grad);color:#fff;border-color:transparent}

/* ---------- 存储 ---------- */
const KEY = 'mama_hub_v1';
let DB;
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); return Object.assign(seed(), d); }
  } catch (e) { console.warn(e); }
  return seed();
}
function save(push = true) {
  DB.meta.updatedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { toast('存储空间不足'); }
  if (push) queueSync();
}
DB = load();

/* ---------- 周期任务逻辑 ---------- */
function periodKey(task, d = new Date()) {
  switch (task.repeat) {
    case 'daily': return 'D' + ymd(d);
    case 'weekly': return 'W' + ymd(startOfWeek(d));
    case 'monthly': return 'M' + ymd(d).slice(0, 7);
    default: return 'ONCE';
  }
}
const isDone = t => (t.doneKeys || []).includes(periodKey(t));
function toggleTask(id) {
  const t = DB.tasks.find(x => x.id === id); if (!t) return;
  const k = periodKey(t); t.doneKeys = t.doneKeys || [];
  const i = t.doneKeys.indexOf(k);
  if (i >= 0) t.doneKeys.splice(i, 1);
  else { t.doneKeys.push(k); if (t.doneKeys.length > 120) t.doneKeys = t.doneKeys.slice(-120); confetti(); }
  save(); render();
}
const openTasks = mod => DB.tasks.filter(t => (!mod || t.mod === mod) && !isDone(t));
const kindOpen = kind => DB.tasks.filter(t => KINDS[kind].mods.includes(t.mod) && !isDone(t));
// 按星期几命中：无 days 字段=每天；有 days=只在指定星期几出现（0=周日…6=周六）
const dayMatch = t => !t.days || t.days.includes(new Date().getDay());

/* ---------- 打卡 ---------- */
function ck(sid) { return DB.checkins[sid] || (DB.checkins[sid] = []); }
function toggleCk(sid, date) {
  const a = ck(sid); const i = a.indexOf(date);
  if (i >= 0) a.splice(i, 1); else { a.push(date); confetti(); }
  save(); render();
}
const ckWeekCount = (sid, ws) => { const a = ck(sid); let n = 0; for (let i = 0; i < 7; i++) if (a.includes(ymd(addDays(ws, i)))) n++; return n; };
function streak(sid) { const a = ck(sid); let n = 0, d = new Date(); if (!a.includes(ymd(d))) d = addDays(d, -1); while (a.includes(ymd(d))) { n++; d = addDays(d, -1); } return n; }

function schedKey(it) { return ymd(new Date()) + '|' + it.id; }
function ananSchedule() {
  const today = new Date().getDay();
  const items = (DB.schedule || []).filter(it => (it.days || []).includes(today)).map(it => {
    const m = (it.time || '').match(/^(\d{1,2}):(\d{2})/);
    const start = m ? (+m[1]) * 60 + (+m[2]) : 9999;
    return { it, start };
  }).sort((a, b) => a.start - b.start);
  if (!items.length) return emptyBox('今天没有排课，出去玩吧 🌈', '🗓');
  return `<div class="sched">${items.map(({ it }) => {
    const done = (DB.schedCk || []).includes(schedKey(it));
    return `<div class="sched-i ${done ? 'done' : ''}" data-act="sched" data-id="${it.id}">
      <span class="sched-t">${esc(it.time)}</span>
      <span class="sched-line"></span>
      <div class="sched-body">
        <b>${esc(it.title)}</b>
        <span class="sched-sub">${esc(it.sub || '')}</span>
      </div>
      <span class="sched-ck">${done ? '✅' : '⬜'}</span>
    </div>`;
  }).join('')}</div>`;
}
function toggleSched(id) {
  DB.schedCk = DB.schedCk || [];
  const k = schedKey({ id });
  const i = DB.schedCk.indexOf(k);
  if (i >= 0) DB.schedCk.splice(i, 1); else DB.schedCk.push(k);
  save(); render();
}

/* ---------- 通用表单弹窗 ---------- */
function openForm(cfg) {
  const root = $('#modalRoot');
  const f = cfg.fields.map(fd => {
    const v = fd.val == null ? '' : fd.val;
    let inp;
    if (fd.type === 'select') inp = `<select name="${fd.k}">${fd.opts.map(o => `<option value="${esc(o.v)}" ${String(o.v) === String(v) ? 'selected' : ''}>${esc(o.t)}</option>`).join('')}</select>`;
    else if (fd.type === 'textarea') inp = `<textarea name="${fd.k}" placeholder="${esc(fd.ph || '')}">${esc(v)}</textarea>`;
    else inp = `<input name="${fd.k}" type="${fd.type || 'text'}" value="${esc(v)}" placeholder="${esc(fd.ph || '')}" ${fd.type === 'number' ? 'step="0.01"' : ''}/>`;
    return `<div class="field" style="${fd.half ? '' : 'grid-column:1/-1'}"><label>${esc(fd.label)}</label>${inp}</div>`;
  }).join('');
  root.hidden = false;
  root.innerHTML = `<div class="modal">
    <div class="modal-h"><h3>${esc(cfg.title)}</h3><button class="icon-btn" data-act="close">✕</button></div>
    <form class="modal-b" id="mForm"><div style="display:grid;grid-template-columns:1fr 1fr;gap:0 10px">${f}</div></form>
    <div class="modal-f">
      ${cfg.onDelete ? `<button class="btn btn-g" data-act="mdel">删除</button>` : ''}
      <button class="btn btn-g" data-act="close">取消</button>
      <button class="btn btn-p" data-act="msave">保存</button>
    </div>
    <div style="height:16px"></div>
  </div>`;
  root.onclick = e => {
    if (e.target === root) return closeModal();
    const a = e.target.closest('[data-act]'); if (!a) return;
    if (a.dataset.act === 'close') closeModal();
    if (a.dataset.act === 'mdel') { if (confirm('确定删除吗？')) { cfg.onDelete(); closeModal(); save(); render(); } }
    if (a.dataset.act === 'msave') {
      const data = {};
      new FormData($('#mForm')).forEach((v, k) => data[k] = typeof v === 'string' ? v.trim() : v);
      if (cfg.onSave(data) !== false) { closeModal(); save(); render(); toast('已保存 ✨'); }
    }
  };
  // 模块 ↔ 子分类联动
  const modSel = root.querySelector('[name="mod"]'), subSel = root.querySelector('[name="sub"]');
  if (modSel && subSel) {
    const fill = keep => {
      const subs = MOD(modSel.value).subs || [];
      subSel.innerHTML = subs.map(s => `<option value="${esc(s)}" ${s === keep ? 'selected' : ''}>${esc(s)}</option>`).join('');
    };
    fill(subSel.value);
    modSel.addEventListener('change', () => fill());
  }
  setTimeout(() => { const i = root.querySelector('input,textarea,select'); if (i) i.focus(); }, 60);
}
function closeModal() { const r = $('#modalRoot'); r.hidden = true; r.innerHTML = ''; }

/* ---------- 各类编辑器 ---------- */
const modOpts = MODULES.filter(m => m.id !== 'dash').map(m => ({ v: m.id, t: m.name }));
function taskForm(t, presetMod, presetSub) {
  const isNew = !t;
  t = t || { mod: presetMod || 'anan', sub: presetSub || '', pri: 'mid', repeat: 'once', tags: [], doneKeys: [] };
  const m = MOD(t.mod);
  openForm({
    title: isNew ? '新建待办' : '编辑待办',
    fields: [

function openSettings() {
  const s = DB.sync || {};
  const root = $('#modalRoot'); root.hidden = false;
  const sameOrigin = location.origin && location.origin.indexOf('http') === 0 && !location.origin.endsWith('null');
  const conn = (esConn && esConn.readyState === 1) ? '🟢 已连接实时同步' : (s.auto && s.url ? '🟡 轮询同步中（每30秒）' : '⚪ 未连接');
  root.innerHTML = `<div class="modal">
    <div class="modal-h"><h3>⚙ 数据与手机同步</h3><button class="icon-btn" data-act="close">✕</button></div>
    <div class="modal-b">
      <div class="card" style="box-shadow:none;background:var(--grad-soft);border:none;margin-bottom:14px">
        <b style="font-size:13px">📱 在手机上使用</b>
        <div class="t-note" style="font-size:12px;line-height:1.8;margin-top:6px">
          1. 手机和电脑打开<b>同一个网址</b>（本页地址）<br>
          2. Safari「分享 → 添加到主屏幕」/ 安卓「添加到桌面」，即可像 App 一样打开<br>
          3. 点下面「使用当前网址」并开启自动同步，手机电脑就<b>实时一致</b>啦
        </div>
      </div>
      ${sameOrigin ? `<button class="btn btn-soft btn-block" data-act="use-origin" style="margin-bottom:12px">📡 使用当前网址作为同步地址</button>` : ''}
      <div class="field"><label>云同步地址（支持「妈妈同步服务端」或 JSONBin）</label>
        <input id="syncUrl" value="${esc(s.url || '')}" placeholder="https://你的服务地址.onrender.com"/></div>
      <div class="field"><label>访问密钥（可选）</label>
        <input id="syncKey" value="${esc(s.key || '')}" placeholder="与同步服务端 SYNC_KEY 一致即可"/></div>
      <div class="field"><label><input type="checkbox" id="syncAuto" ${s.auto ? 'checked' : ''} style="width:auto;margin-right:6px"/> 开启自动同步（改动后自动上传 + 实时接收其他设备更新）</label></div>
      <div class="seg" style="margin-bottom:10px">
        <button data-act="sync-push">⬆️ 上传到云端</button>
        <button data-act="sync-pull">⬇️ 从云端拉取</button>
      </div>
      <div style="font-size:12px;margin-bottom:14px;color:var(--muted)">
        同步状态：${conn} ｜ 最近同步：${s.last ? new Date(s.last).toLocaleString('zh-CN') : '尚未同步'}
      </div>
      <div class="seg">
        <button data-act="export">💾 导出备份</button>
        <button data-act="import">📂 导入备份</button>
        <button data-act="reset">♻️ 恢复示例</button>
      </div>
    </div>
    <div class="modal-f"><button class="btn btn-p btn-block" data-act="save-set">保存设置</button></div>
    <div style="height:16px"></div>
  </div>`;
  root.onclick = e => {
    if (e.target === root) return closeModal();
    const a = e.target.closest('[data-act]'); if (!a) return;
    const act = a.dataset.act;
    if (act === 'close') closeModal();
    if (act === 'use-origin') { if ($('#syncUrl')) $('#syncUrl').value = location.origin; toast('已填入当前网址，记得开启自动同步 👍'); }
    if (act === 'save-set') { grabSync(); save(); connectStream(); closeModal(); toast('设置已保存'); }
    if (act === 'sync-push') { grabSync(); save(false); syncPush(true); }
    if (act === 'sync-pull') { grabSync(); save(false); syncPull(true); }
    if (act === 'export') exportJSON();
    if (act === 'import') importJSON();
    if (act === 'reset') { if (confirm('将清空当前数据并恢复示例内容，确定？')) { DB = seed(); save(); closeModal(); render(); toast('已恢复示例数据'); } }
  };
}
function grabSync() {
  DB.sync = DB.sync || {};
  DB.sync.url = ($('#syncUrl') || {}).value || '';
  DB.sync.key = ($('#syncKey') || {}).value || '';
  DB.sync.auto = !!($('#syncAuto') || {}).checked;
}
function exportJSON() {
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `妈妈工作台备份_${TODAY()}.json`;
  a.click(); toast('备份已下载');
}
function importJSON() {
  const i = document.createElement('input'); i.type = 'file'; i.accept = '.json';
  i.onchange = () => {
    const f = i.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { DB = Object.assign(seed(), JSON.parse(r.result)); save(); closeModal(); render(); toast('导入成功 ✨'); } catch (e) { toast('文件格式不对'); } };
    r.readAsText(f);
  };
  i.click();
}
let syncTimer = null;
let esConn = null;
function isJsonbin() { return !!(DB.sync && DB.sync.url && DB.sync.url.includes('jsonbin')); }
function syncBaseUrl() {
  const u = (DB.sync.url || '').replace(/\/+$/, '');
  return isJsonbin() ? u : u + '/api/db';
}
function syncHeaders() {
  const h = { 'Content-Type': 'application/json' };
  if (DB.sync.key) h['X-Sync-Key'] = DB.sync.key;
  if (isJsonbin() && DB.sync.key) { h['X-Master-Key'] = DB.sync.key; h['X-Access-Key'] = DB.sync.key; }
  return h;
}
function syncQuery() {
  return (DB.sync && DB.sync.key && !isJsonbin()) ? ('?key=' + encodeURIComponent(DB.sync.key)) : '';
}
function queueSync() {
  if (!DB.sync || !DB.sync.auto || !DB.sync.url) return;
  clearTimeout(syncTimer); syncTimer = setTimeout(() => syncPush(false), 2000);
}
async function syncPush(loud) {
  if (!DB.sync || !DB.sync.url) { if (loud) toast('请先填写同步地址'); return; }
  try {
    const r = await fetch(syncBaseUrl() + syncQuery(), { method: 'PUT', headers: syncHeaders(), body: JSON.stringify(DB) });
    if (!r.ok) throw new Error('status ' + r.status);
    DB.sync.last = Date.now(); localStorage.setItem(KEY, JSON.stringify(DB));
    if (loud) { toast('已上传到云端 ☁️'); openSettings(); }
  } catch (e) { if (loud) toast('上传失败，请检查地址'); }
}
async function syncPull(loud) {
  if (!DB.sync || !DB.sync.url) { if (loud) toast('请先填写同步地址'); return; }
  try {
    const url = isJsonbin()
      ? (DB.sync.url.replace(/\/+$/, '') + (DB.sync.url.endsWith('/latest') ? '' : '/latest'))
      : syncBaseUrl() + syncQuery();
    const r = await fetch(url, { headers: syncHeaders() });
    const j = await r.json();
    const remote = j && j.record ? j.record : j;
    if (remote && remote.meta) {
      if (remote.meta.updatedAt >= (DB.meta.updatedAt || 0)) {
        const keepSync = DB.sync;
        DB = Object.assign(seed(), remote); DB.sync = keepSync; DB.sync.last = Date.now();
        localStorage.setItem(KEY, JSON.stringify(DB));
        render(); if (loud) { toast('已拉取云端数据 ☁️'); openSettings(); }
      } else if (loud) toast('本地数据更新，无需拉取');
    } else if (loud) toast('云端还没有数据，先上传一次吧');
  } catch (e) { if (loud) toast('拉取失败，请检查地址'); }
}
function connectStream() {
  if (esConn) { try { esConn.close(); } catch (e) {} esConn = null; }
  if (!DB.sync || !DB.sync.auto || !DB.sync.url || isJsonbin()) return; // SSE 仅自有服务端支持
  try {
    const u = (DB.sync.url.replace(/\/+$/, '')) + '/api/stream' + syncQuery();
    esConn = new EventSource(u);
    esConn.onmessage = () => { if ($('#modalRoot').hidden) syncPull(false); };
    esConn.onerror = () => { /* 浏览器会自动重连 */ };
  } catch (e) {}
}
// 每 30 秒保底拉取一次（SSE 的补充，防止极端断连）
setInterval(() => { if (DB.sync && DB.sync.auto && DB.sync.url && $('#modalRoot').hidden) syncPull(false); }, 30000);

    case 'del-note': if (confirm('删除该笔记？')) { DB.xnotes = DB.xnotes.filter(x => x.id !== id); save(); render(); } break;
    case 'add-topic': topicForm(); break;
    case 'edit-topic': topicForm(DB.xtopics.find(x => x.id === id)); break;
    case 'add-post': postForm(); break;
    case 'edit-post': postForm(DB.xposts.find(x => x.id === id)); break;
    case 'del-post': if (confirm('删除该条数据？')) { DB.xposts = DB.xposts.filter(x => x.id !== id); save(); render(); } break;
    case 'add-book': bookForm(); break;
    case 'edit-book': bookForm(DB.books.find(x => x.id === id)); break;
    case 'del-book': if (confirm('删除这本书？')) { DB.books = DB.books.filter(x => x.id !== id); save(); render(); } break;
    case 'add-shop': shopForm(); break;
    case 'tg-shop': { const s = DB.shopping.find(x => x.id === id); s.done = !s.done; if (s.done) confetti(); save(); render(); break; }
    case 'del-shop': DB.shopping = DB.shopping.filter(x => x.id !== id); save(); render(); break;
  }
});
$('#btnQuickAdd').onclick = () => taskForm(null, TAB === 'dash' ? 'anan' : TAB);
$('#btnSettings').onclick = openSettings;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ---------- 启动 ---------- */
render();
if (DB.sync && DB.sync.auto && DB.sync.url) { syncPull(false); connectStream(); }
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => { }); }

</script>
